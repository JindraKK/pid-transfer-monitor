name: PID snapshot

# Sbira realtime zpozdeni prestupu 336 -> 384 na Zlicine a commituje vysledek
# do data/results.csv. Bezi na GitHub-hosted runneru (ma volny ven na internet,
# na rozdil od Claude cloud environmentu, ktery api.golemio.cz blokuje).

on:
  workflow_dispatch:             # rucni spusteni (Actions -> PID snapshot -> Run workflow)
    inputs:
      minutes:
        description: "Delka pollovani v minutach (jen pro rucni beh)"
        required: false
        default: "16"
  schedule:
    # Cron je v UTC a GitHub ho negarantuje presne - obcas zabery meskaji
    # o desitky minut, jednou i o hodiny (overeno v provozu 9.-11.9.2026).
    # Proto misto 3 presnych zaberu bezi kazdych 15 min v siroke oknu 3:00-7:59
    # UTC (= 5:00-9:59 leto / 4:00-8:59 zima), coz pokryje oba spoje v obou
    # rocnich obdobich s velkou rezervou. `snapshot --wait` sam pozna, jestli
    # je "na rade" nejaky prestup (~40 min pred nim az do jeho konce) - pokud
    # ne, beh skonci za par vterin, takze ta frekvence nic nestoji.
    - cron: '*/15 3-7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: pid-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: snapshot
        env:
          GOLEMIO_API_KEY: ${{ secrets.GOLEMIO_API_KEY }}
        run: python3 monitor.py snapshot --wait --minutes ${{ github.event.inputs.minutes || '16' }}

      - name: commit results
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Zadna nova data (vikend / svatek / spatny cron zaber / uz existuje)."
            exit 0
          fi
          git config user.name  "pid-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "snapshot $(date -u '+%F %H:%M') UTC"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
