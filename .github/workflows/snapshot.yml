name: PID snapshot

# Sbira realtime zpozdeni prestupu 336 -> 384 na Zlicine a commituje vysledek
# do data/results.csv. Bezi na GitHub-hosted runneru (ma volny ven na internet,
# na rozdil od Claude cloud environmentu, ktery api.golemio.cz blokuje).

on:
  workflow_dispatch:             # rucni spusteni (Actions -> PID snapshot -> Run workflow)
    inputs:
      minutes:
        description: "Delka pollovani v minutach (jen pro rucni beh)"
        required: false
        default: "16"
  schedule:
    # ZMERENO 9.-12.9.2026 (viz logs/reliability-test-2026-09-12.md): GitHub
    # v praxi spoustel scheduled beh na tomhle repu jen cca 1x DENNE, uplne
    # bez ohledu na to, jestli byl cron 3 zabery/den nebo 20 zaberu/den, a s
    # nepredvidatelnym zpozdenim (par minut az 4,5 hodiny). Zvyseni frekvence
    # cronu tedy problem neresi - GitHub scheduled trigger neni spolehlivy
    # zdroj pro presny cas. Necham ho bezet jako bezplatny bonus (obcas neco
    # chytne), ale PRIMARNI sber je ted lokalni Planovac uloh + git_sync (viz
    # README cast 3b) - ten uspesne dodal data 10.9. i 14.9.
    - cron: '*/15 3-7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: pid-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: snapshot
        env:
          GOLEMIO_API_KEY: ${{ secrets.GOLEMIO_API_KEY }}
        run: python3 monitor.py snapshot --wait --minutes ${{ github.event.inputs.minutes || '16' }}

      - name: commit results
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Zadna nova data (vikend / svatek / spatny cron zaber / uz existuje)."
            exit 0
          fi
          git config user.name  "pid-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "snapshot $(date -u '+%F %H:%M') UTC"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
